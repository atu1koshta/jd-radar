[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "job-hunter-ai"
version = "0.0.1"
description = "Multi-portal job-hunting assistant: search, score, alert, draft."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Atul Koshta" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "loguru>=0.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ollama>=0.3",
    "sqlmodel>=0.0.16",
    "tenacity>=8.5",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.45",
    "playwright-stealth>=1.0.6",
    "trafilatura>=1.10",
    "markdownify>=0.12",
]
notify = [
    "python-telegram-bot>=21.0",
]
embeddings = [
    "sentence-transformers>=3.0",
]
llm-cloud = [
    "anthropic>=0.34",
    "openai>=1.40",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
jobhunter = "jobhunter.cli:app"

# Plugin discovery — built-in adapters register here.
[project.entry-points."jobhunter.llm"]
ollama = "jobhunter.adapters.llm.ollama:OllamaProvider"

[project.entry-points."jobhunter.portals"]
naukri = "jobhunter.adapters.portals.naukri.adapter:NaukriAdapter"

# Action adapters land in Phase 3 — re-enable entries when files exist.
# [project.entry-points."jobhunter.actions"]
# alert = "jobhunter.adapters.actions.alert:AlertAction"
# draft_email = "jobhunter.adapters.actions.draft_email:DraftEmailAction"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
